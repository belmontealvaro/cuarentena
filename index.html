<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Cuarentena: defiende la red casilla a casilla. Juego de estrategia cartoon sobre ciberseguridad.">
  <meta name="theme-color" content="#2b2140">
  <title>Cuarentena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css?v=1">
</head>
<body>
  <div id="app">
    <header id="barra">
      <div id="cpu" title="CPU disponible"><span class="chip">+</span><b id="cpuNum">0</b><small>CPU</small></div>
      <div id="cartas"></div>
      <button id="btnQuitar" class="carta herramienta" title="Desinstalar una defensa (Q)">
        <span class="tecla">Q</span><span class="aspa">✕</span><span class="nombre">Quitar</span>
      </button>
    </header>

    <main id="zona">
      <canvas id="lienzo"></canvas>
      <div id="cartelPrep" class="oculto">
        <span>Prepara tus defensas · la horda llega en <b id="prepNum">0</b></span>
        <button id="btnVenga" class="boton">¡Que vengan ya!</button>
      </div>
      <div id="cartel"></div>
      <div id="girar">Gira el móvil: en horizontal el tablero se ve mucho mejor</div>
      <div id="tutorialCaja" class="oculto"></div>
      <div id="capa" class="oculto"></div>
    </main>

    <footer id="pie">
      <b id="faseNombre"></b>
      <div id="progreso" title="Progreso de la horda"><i id="progresoBarra"></i></div>
      <span id="restantes"></span>
      <span id="coladas"></span>
      <span id="ayuda"></span>
      <span id="velocidades" title="Velocidad del juego"></span>
      <button id="btnPausa" class="boton" title="Pausa (Esc)">Pausa</button>
      <span id="ajustes"></span>
    </footer>
  </div>

  <div id="ficha" class="oculto"></div>
  <div id="tutorialAnillo" class="oculto"></div>

  <!-- El orden importa solo en esto: núcleo primero, main al final.
       ?v=N evita la caché del navegador: al publicar cambios, sube el número en todas las líneas. -->
  <script src="js/nucleo.js?v=1"></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/dibujo.js?v=1"></script>
  <script src="js/escenarios.js?v=1"></script>
  <script src="js/decorados.js?v=1"></script>
  <script src="js/amenazas.js?v=1"></script>
  <script src="js/defensas.js?v=1"></script>
  <script src="js/niveles.js?v=1"></script>
  <script src="js/motor.js?v=1"></script>
  <script src="js/render.js?v=1"></script>
  <script src="js/audio.js?v=1"></script>
  <script src="js/musica.js?v=1"></script>
  <script src="js/espectaculo.js?v=1"></script>
  <script src="js/ui.js?v=1"></script>
  <script src="js/equipo.js?v=1"></script>
  <script src="js/mundo.js?v=1"></script>
  <script src="js/mundoDetalles.js?v=1"></script>
  <script src="js/desarrollo.js?v=1"></script>
  <script src="js/mapa.js?v=1"></script>
  <script src="js/enciclopedia.js?v=1"></script>
  <script src="js/tutorial.js?v=1"></script>
  <script src="js/main.js?v=1"></script>
</body>
</html>
